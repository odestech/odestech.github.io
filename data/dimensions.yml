# Project override of hinode/data/dimensions.yml, read by
# assets/helpers/GetDimension.html to decide which widths to generate.
#
# Upstream tops out at 2800px. The photo masters in assets/ are 2000px wide, so
# that tier only ever upscales: a 2800px derivative carries no more detail than
# the source and the PNG fallback for it came to 3 MB. The widest slot on this
# site is the detail-page hero inside the content column, so 1400 already
# covers a 2x display.
#
# Raise this again if a genuinely larger master is added.
- ratio: 4x3
  dimensions:
    - 576x432
    - 768x576
    - 992x744
    - 1200x900
    - 1400x1050
- ratio: 3x2
  dimensions:
    - 576x384
    - 768x512
    - 992x661
    - 1200x800
    - 1400x933
- ratio: 1x1
  dimensions:
    - 576x576
    - 768x768
    - 992x992
    - 1200x1200
    - 1400x1400
- ratio: 16x9
  dimensions:
    - 576x324
    - 768x432
    - 992x558
    - 1200x675
    - 1400x788
- ratio: 21x9
  dimensions:
    - 576x247
    - 768x329
    - 992x425
    - 1200x514
    - 1400x600
- ratio: auto
  dimensions:
    - 576
    - 768
    - 992
    - 1200
    - 1400
