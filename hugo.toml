baseURL = "https://www.odestech.cn/"
title = "ODES Technology"
copyright = "© 2026 上海奥得斯科技有限公司"

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
hasCJKLanguage = true

[pagination]
  pagerSize = 9

[module]
  [[module.imports]]
    path = "github.com/gethinode/hinode"

# 全站级别：禁止 metadata / TOC（Hinode cascade 用法是正确的）
[[cascade]]
  [cascade.params]s
    metadata = "none"
    includeToc = false

[params]
  description = "Shanghai Odes Technology Co., Ltd. - Overseas. Dedicated. Excellent. Synergistic"
  customCSS = ["css/custom.css"]
  search = false

  [params.page]
    showMeta = false

  [params.main]
    separator = "-"
    endorse = false
    footerBelowFold = false
    breakpoint = "md"

    [params.main.colorMode]
      enabled = true
      modes = ["light", "dark"]
      toggle = false
      iconLight = "fas sun"
      iconDark = "fas moon"

  [params.style]
    primary = "#002FA7"
    themeOpacity = 10

  [params.navigation]
    toc = false
    breadcrumb = true
    sidebar = true
    logo = "/images/logo.png"
    logoHeight = 28
    search.enabled = false

  [params.logo]
    path = "images/logo.png"

  [params.pages]
    [params.pages.business]
      metadata = "none"
      sharing = false

    [params.pages.contact]
      metadata = "none"
      sharing = false


  [params.sharing]
    enabled = false

# =========================
# 多语言配置（关键修复点）
# =========================

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

[languages]

  [languages.zh]
    languageName = "中文"
    weight = 1
    contentDir = "content/zh"

    [[languages.zh.menu.main]]
      name = "首页"
      url = "/"
      weight = 10

    [[languages.zh.menu.main]]
      name = "关于我们"
      url = "/about/"
      weight = 20

    [[languages.zh.menu.main]]
      name = "核心业务"
      url = "/business/"
      weight = 30

    [[languages.zh.menu.main]]
      name = "联系我们"
      url = "/contact/"
      weight = 40


  [languages.en]
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    
    # 【修复1】直接在语言根目录下声明版权，覆盖全局设置
    copyright = "© 2026 ODES Technology"
    title = "ODES Technology"

    # 英文参数区
    [languages.en.params]
      # 覆盖默认描述，防止出现 "I work on coding..."
      description = "Dedicated to China-US trade and cross-border collaboration"
      
      [languages.en.params.head]
        tagline = "Overseas. Dedicated. Excellent. Synergistic"

      # 【修复2】显式关闭社交模块
      [languages.en.params.social]
        title = ""
        caption = ""
        enabled = false

      # 【修复3】双重保险：在 params.footer 里也写一遍版权
      [languages.en.params.footer]
        copyright = "© 2026 ODES Technology"
        endorse = false
        showSocial = false  # 尝试关闭社交显示

    # 英文菜单配置
    [[languages.en.menu.main]]
      name = "Home"
      url = "/"           
      weight = 10

    [[languages.en.menu.main]]
      name = "About Us"
      url = "/about/"    
      weight = 20

    [[languages.en.menu.main]]
      name = "Core Business"
      url = "/business/"
      weight = 30

    [[languages.en.menu.main]]
      name = "Contact"
      url = "/contact/"
      weight = 40

# =========================
# 渲染与输出配置 (保持不变)
# =========================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    style = "monokai"
    lineNos = false


[minify]
  [minify.tdewolff.html]
    keepWhitespace = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]