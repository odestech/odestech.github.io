name: Build check

# Deployment is done by Cloudflare Pages' own Git integration: Cloudflare
# watches this repository and builds every push itself (main -> production,
# other branches -> preview). This workflow only proves that a push builds and
# that the output is complete, so a broken commit is visible on GitHub before
# anyone looks at Cloudflare. It deploys nothing.
#
# Cloudflare Pages build settings must be:
#   Build command:          npm run build
#   Build output directory: dist
#   Node version:           22 (read from .node-version)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Middleware tests (redirects, Markdown negotiation)
        run: npm test

      - name: Build (Vite client + SSR prerender)
        run: npm run build

      - name: SEO check (Ahrefs Site Audit rules)
        run: npm run check:seo

      - name: Verify output
        run: |
          set -e
          for l in "" es/ fr/ pt/ zh/; do
            for p in index.html about/index.html business/index.html business/medical/index.html business/energy/index.html contact/index.html 404.html; do
              test -s "dist/$l$p" || { echo "missing dist/$l$p"; exit 1; }
            done
          done
          for f in sitemap.xml robots.txt llms.txt llms-full.txt _redirects _headers _routes.json index.md es/index.md fr/index.md pt/index.md zh/index.md; do
            test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          # Every page must ship its content as HTML, not an empty root div.
          for f in $(find dist -name index.html); do
            grep -q '<h1' "$f" || { echo "no <h1> in $f"; exit 1; }
            grep -q 'rel="canonical"' "$f" || { echo "no canonical in $f"; exit 1; }
            test "$(grep -o 'hreflang=' "$f" | wc -l)" -ge 6 || { echo "missing hreflang in $f"; exit 1; }
          done
          grep -q '^Content-Signal: ' dist/robots.txt || { echo "robots.txt lacks Content-Signal"; exit 1; }
          # Whole word only: Portuguese "manuseio" (handling) is not a leftover.
          if grep -rqiw 'manus' dist --include=*.html; then echo "Manus leftovers in output"; exit 1; fi
          echo "output OK: $(find dist -name '*.html' | wc -l) HTML files"
