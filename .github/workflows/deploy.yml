name: Build and deploy to Cloudflare Pages

# main             -> production deployment (www.odestech.cn once the custom domain is attached)
# any other branch -> preview deployment at <branch>.<project>.pages.dev (noindex)
#
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional repository variable: CF_PAGES_PROJECT (default "odestech").
# Without the secrets the workflow still builds and checks the site, and skips deploying.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'odestech' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build (Vite client + SSR prerender)
        run: npm run build

      - name: Verify output
        run: |
          set -e
          for f in index.html zh/index.html about/index.html business/medical/index.html business/energy/index.html \
                   contact/index.html 404.html zh/404.html sitemap.xml robots.txt llms.txt llms-full.txt _redirects _headers; do
            test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          # Every page must ship its content as HTML, not an empty root div.
          for f in $(find dist -name index.html); do
            grep -q '<h1' "$f" || { echo "no <h1> in $f"; exit 1; }
            grep -q 'rel="canonical"' "$f" || { echo "no canonical in $f"; exit 1; }
          done
          if grep -rqi 'manus' dist --include=*.html; then echo "Manus leftovers in output"; exit 1; fi
          echo "output OK: $(find dist -name '*.html' | wc -l) HTML files"

      - name: Create Pages project (first run only; fails harmlessly if it exists)
        if: env.HAS_CF_TOKEN == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.CF_PROJECT }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}

      - name: Note skipped deploy
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; the site was built and checked but not deployed. See docs/DEPLOY.md."
